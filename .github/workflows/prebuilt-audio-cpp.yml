name: Build prebuilt audio-cpp artifacts

on:
  # 发版 tag 或开发期 submodule 指针变动时构建：GitHub 语义下 tags 与 branches 取 OR，
  # 再与 paths 取 AND，即 (tag 为 v* 或分支为 main) 且本次 push 改动 audio.cpp submodule 才触发。
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'audio-cpp-sys/audio.cpp'
  workflow_dispatch:
      inputs:
        upload_to_release:
          description: Upload artifacts to the selected tag release
          type: boolean
          default: false
        tag:
          description: Existing tag to upload assets to (workflow_dispatch only)
          required: false
          default: ""
        platform:
          description: OS to build (tag pushes always build all)
          type: choice
          default: all
          options:
            - all
            - linux
            - windows
            - macos

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  linux-prebuilt:
    name: Linux prebuilt (${{ matrix.label }})
    if: ${{ inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "x64 cpu full",     runner: "ubuntu-24.04",     target: "x86_64-unknown-linux-gnu",   backend: "cpu",    modelset: "full", features: "full-models" }
          - { label: "x64 vulkan full",  runner: "ubuntu-24.04",     target: "x86_64-unknown-linux-gnu",   backend: "vulkan", modelset: "full", features: "full-models,vulkan" }
          - { label: "arm64 cpu full",   runner: "ubuntu-24.04-arm", target: "aarch64-unknown-linux-gnu",  backend: "cpu",    modelset: "full", features: "full-models" }
          - { label: "arm64 vulkan full", runner: "ubuntu-24.04-arm", target: "aarch64-unknown-linux-gnu",  backend: "vulkan", modelset: "full", features: "full-models,vulkan" }
    env:
      TARGET_TRIPLE: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake ninja-build git libclang-dev

      - name: Install Vulkan dependencies
        if: contains(matrix.features, 'vulkan')
        run: |
          sudo apt-get install -y libvulkan-dev glslang-tools spirv-headers glslc
          # Ubuntu 24.04 的 glslc 是独立包（source 为 shaderc）；glslang-tools 只含
          # glslangValidator，不提供 glslc。
          command -v glslc || echo "::warning::glslc not found in PATH"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: ". -> target"
          shared-key: prebuilt-linux-${{ env.TARGET_TRIPLE }}-${{ matrix.backend }}-${{ matrix.modelset }}-v2
          cache-targets: false
          cache-on-failure: false

      - name: Build audio-cpp-sys (prebuilt target)
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p audio-cpp-sys \
            --release \
            --target "${TARGET_TRIPLE}" \
            --no-default-features \
            --features "${{ matrix.features }}"

      - name: Compute asset name
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          # 父仓库记录的 submodule gitlink（完整 40 位 SHA），与消费端 local_audio_commit 口径一致。
          AUDIO_COMMIT="$(git ls-tree HEAD audio-cpp-sys/audio.cpp | awk '{print substr($3,1,12)}')"
          echo "AUDIO_COMMIT=$AUDIO_COMMIT" >> "$GITHUB_ENV"
          # 上传目标 Release：tag push / dispatch 用显式 tag，main 开发期用 crate 版本（v{CARGO_PKG_VERSION}）。
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            PKG_VER="$(cargo pkgid -p audio-cpp-sys | sed 's/.*@//')"
            TAG="v${PKG_VER}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "ASSET_NAME=audio-cpp-prebuilt-linux-${TARGET_TRIPLE}-${{ matrix.backend }}-${{ matrix.modelset }}-static-${AUDIO_COMMIT}.tar.gz" >> "$GITHUB_ENV"

      - name: Collect prebuilt libraries
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/prebuilt"
          bash .github/scripts/collect-unix-prebuilt.sh "$ROOT" linux
          cat > "$ROOT/metadata.json" <<EOF
          {"target":"${TARGET_TRIPLE}","features":"${{ matrix.features }}","modelset":"${{ matrix.modelset }}","audio_commit":"${AUDIO_COMMIT}"}
          EOF
          tar -C "$ROOT" -czf "$RUNNER_TEMP/$ASSET_NAME" .

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.upload_to_release == true || github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="$TAG"
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --title "$TAG_NAME" --notes "Prebuilt artifacts for $TAG_NAME"
          fi
          gh release upload "$TAG_NAME" "$RUNNER_TEMP/$ASSET_NAME" --clobber

  windows-prebuilt:
    name: Windows prebuilt (${{ matrix.label }})
    if: ${{ inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-2022
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          # full × CRT 双变体：md（动态 CRT，默认）/ mt（静态 CRT，crt-static）。
          - { label: "x64 cpu full md",    target: "x86_64-pc-windows-msvc", backend: "cpu",    modelset: "full", crt: "md", features: "full-models" }
          - { label: "x64 cpu full mt",    target: "x86_64-pc-windows-msvc", backend: "cpu",    modelset: "full", crt: "mt", features: "full-models" }
          - { label: "x64 vulkan full md", target: "x86_64-pc-windows-msvc", backend: "vulkan", modelset: "full", crt: "md", features: "full-models,vulkan" }
          - { label: "x64 vulkan full mt", target: "x86_64-pc-windows-msvc", backend: "vulkan", modelset: "full", crt: "mt", features: "full-models,vulkan" }
    env:
      TARGET_TRIPLE: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: ". -> target"
          shared-key: prebuilt-windows-${{ env.TARGET_TRIPLE }}-${{ matrix.backend }}-${{ matrix.modelset }}-${{ matrix.crt }}-v2
          cache-targets: false
          cache-on-failure: false

      - name: Setup Vulkan SDK
        if: contains(matrix.features, 'vulkan')
        uses: ./.github/actions/setup-vulkan-sdk-windows

      - name: Build audio-cpp-sys (prebuilt target)
        shell: bash
        run: |
          set -euo pipefail
          # mt 变体：crt-static 让 Rust/cc 侧用 /MT，build.rs 同步给 CMake 注入 /MT。
          if [ "${{ matrix.crt }}" = "mt" ]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          cargo build -p audio-cpp-sys \
            --release \
            --target "${TARGET_TRIPLE}" \
            --no-default-features \
            --features "${{ matrix.features }}"

      - name: Compute asset name
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          # 父仓库记录的 submodule gitlink（完整 40 位 SHA），与消费端 local_audio_commit 口径一致。
          AUDIO_COMMIT="$(git ls-tree HEAD audio-cpp-sys/audio.cpp | awk '{print substr($3,1,12)}')"
          echo "AUDIO_COMMIT=$AUDIO_COMMIT" >> "$GITHUB_ENV"
          # 上传目标 Release：tag push / dispatch 用显式 tag，main 开发期用 crate 版本（v{CARGO_PKG_VERSION}）。
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            PKG_VER="$(cargo pkgid -p audio-cpp-sys | sed 's/.*@//')"
            TAG="v${PKG_VER}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "ASSET_NAME=audio-cpp-prebuilt-windows-${TARGET_TRIPLE}-${{ matrix.backend }}-${{ matrix.crt }}-${{ matrix.modelset }}-static-${AUDIO_COMMIT}.tar.gz" >> "$GITHUB_ENV"

      - name: Collect prebuilt libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ROOT = "$env:RUNNER_TEMP/prebuilt"
          bash .github/scripts/collect-windows-prebuilt.sh "$ROOT"
          $msvcVer = 0
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -property installationPath 2>$null
            if ($vs) {
              $msvcDir = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory -ErrorAction SilentlyContinue |
                Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
              if ($msvcDir) {
                # 目录名如 "14.44.35207"：MSVC 14.4x 的 _MSC_VER = 1900 + 次版本（14.44 → 1944）。
                $parts = ($msvcDir.Name -split '\.')
                if ($parts[0] -eq '14' -and $parts.Count -ge 2) {
                  $msvcVer = 1900 + [int]$parts[1]
                }
              }
            }
          }
          $json = @{
            target        = "$env:TARGET_TRIPLE"
            features      = "${{ matrix.features }}"
            backend       = "${{ matrix.backend }}"
            crt           = "${{ matrix.crt }}"
            modelset      = "${{ matrix.modelset }}"
            audio_commit  = "$env:AUDIO_COMMIT"
            msvc_ver      = [int]$msvcVer
          } | ConvertTo-Json -Compress
          Set-Content -Path "$ROOT/metadata.json" -Value $json -Encoding ascii
          tar -C "$ROOT" -czf "$env:RUNNER_TEMP/$env:ASSET_NAME" .

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.upload_to_release == true || github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="$TAG"
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --title "$TAG_NAME" --notes "Prebuilt artifacts for $TAG_NAME"
          fi
          gh release upload "$TAG_NAME" "$RUNNER_TEMP/$ASSET_NAME" --clobber

  macos-prebuilt:
    name: macOS prebuilt (${{ matrix.label }})
    if: ${{ inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "arm64 metal full", target: "aarch64-apple-darwin", backend: "metal",  modelset: "full", features: "full-models,metal" }
    env:
      TARGET_TRIPLE: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: ". -> target"
          shared-key: prebuilt-macos-${{ env.TARGET_TRIPLE }}-${{ matrix.backend }}-${{ matrix.modelset }}-v2
          cache-targets: false
          cache-on-failure: false

      - name: Build audio-cpp-sys (prebuilt target)
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p audio-cpp-sys \
            --release \
            --target "${TARGET_TRIPLE}" \
            --no-default-features \
            --features "${{ matrix.features }}"

      - name: Compute asset name
        shell: bash
        run: |
          set -euo pipefail
          # 父仓库记录的 submodule gitlink（完整 40 位 SHA），与消费端 local_audio_commit 口径一致。
          AUDIO_COMMIT="$(git ls-tree HEAD audio-cpp-sys/audio.cpp | awk '{print substr($3,1,12)}')"
          echo "AUDIO_COMMIT=$AUDIO_COMMIT" >> "$GITHUB_ENV"
          # 上传目标 Release：tag push / dispatch 用显式 tag，main 开发期用 crate 版本（v{CARGO_PKG_VERSION}）。
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            PKG_VER="$(cargo pkgid -p audio-cpp-sys | sed 's/.*@//')"
            TAG="v${PKG_VER}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "ASSET_NAME=audio-cpp-prebuilt-macos-${TARGET_TRIPLE}-${{ matrix.backend }}-${{ matrix.modelset }}-static-${AUDIO_COMMIT}.tar.gz" >> "$GITHUB_ENV"

      - name: Collect prebuilt libraries
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/prebuilt"
          bash .github/scripts/collect-unix-prebuilt.sh "$ROOT" macos
          cat > "$ROOT/metadata.json" <<EOF
          {"target":"${TARGET_TRIPLE}","features":"${{ matrix.features }}","modelset":"${{ matrix.modelset }}","audio_commit":"${AUDIO_COMMIT}"}
          EOF
          tar -C "$ROOT" -czf "$RUNNER_TEMP/$ASSET_NAME" .

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.upload_to_release == true || github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="$TAG"
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --title "$TAG_NAME" --notes "Prebuilt artifacts for $TAG_NAME"
          fi
          gh release upload "$TAG_NAME" "$RUNNER_TEMP/$ASSET_NAME" --clobber